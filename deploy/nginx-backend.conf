server {
    listen 80;
    server_name api.enviroo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.enviroo.tech;

    ssl_certificate /etc/letsencrypt/live/api.enviroo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.enviroo.tech/privkey.pem;

    # Upload APK (superadmin): default nginx cuma 1MB, APK bisa sampai 200MB.
    location /app-version/rilis {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
